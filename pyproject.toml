[build-system]
requires = ["setuptools>=77"]                     # PEP 639 license metadata (SPDX string + license-files)
build-backend = "setuptools.build_meta"

[project]
name = "sparsepage"
version = "0.1.0"
description = "Summary-scored page selection for long-context decode attention: score every 128-token page on the GPU, read the top 10-20%, drop the rest (CUDA, graph-capturable)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Minerva Laboratories" }]
keywords = ["attention", "kv-cache", "sparse-attention", "long-context", "decoding", "cuda", "llm-inference", "qwen"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Environment :: GPU :: NVIDIA CUDA",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.4", "numpy"]

[project.optional-dependencies]
eval = ["transformers>=5.2", "pyarrow"]           # end-to-end perplexity on Qwen3.5 (experiments/eval_ppl.py)
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Minerva-Laboratories/SparsePage"
Repository = "https://github.com/Minerva-Laboratories/SparsePage"
Issues = "https://github.com/Minerva-Laboratories/SparsePage/issues"
HgRT = "https://github.com/Minerva-Laboratories/HgRT"
FoveaKV = "https://github.com/Minerva-Laboratories/FoveaKV"
DepthSkip = "https://github.com/Minerva-Laboratories/DepthSkip"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sparsepage = ["csrc/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA (builds the kernels)"]
